<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bine AI - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Floating pulse animation for central workspace logo */
        @keyframes floatGlow {
            0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 10px 15px rgba(236, 72, 153, 0.3)); }
            50% { transform: translateY(-6px) scale(1.03); filter: drop-shadow(0 20px 25px rgba(236, 72, 153, 0.5)); }
        }
        .bine-logo-glow {
            animation: floatGlow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full bg-[#0d1117] text-slate-100 antialiased flex overflow-hidden font-sans selection:bg-pink-500/30">

    <!-- Left Sidebar -->
    <aside class="w-64 bg-[#121721] border-r border-slate-800/80 flex flex-col justify-between p-4 shrink-0 relative z-20">
        <div class="space-y-6">

            <!-- Brand Workspace Header -->
            <a href="index.html" class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-pink-500/50 transition-all group">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-pink-500 transition-transform group-hover:scale-110" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30 80 C20 60, 40 40, 30 20" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
                        <path d="M50 85 C35 60, 65 35, 50 15" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
                        <path d="M70 80 C60 55, 80 40, 70 25" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
                    </svg>
                    <span class="font-bold text-sm text-white tracking-tight">Bine AI Workspace</span>
                </div>
                <i data-lucide="home" class="w-4 h-4 text-slate-400 group-hover:text-pink-400 transition-colors"></i>
            </a>

            <!-- New Chat Button -->
            <button onclick="resetChat()" class="w-full py-2.5 px-3 bg-slate-900 hover:bg-pink-600 text-white font-medium rounded-xl text-xs flex items-center justify-center gap-2 border border-slate-800 hover:border-pink-500 transition-all shadow-lg hover:shadow-pink-500/20">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Synthesis Chat</span>
            </button>

            <!-- Active AI Sources Section -->
            <div>
                <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mb-3 px-1">Active AI Sources</p>
                <div class="space-y-2">
                    <!-- ChatGPT -->
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-colors">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="text-xs font-medium text-slate-200">ChatGPT (GPT-4o)</span>
                        </div>
                        <input type="checkbox" id="model-gpt" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-pink-500 focus:ring-pink-500 accent-pink-500 cursor-pointer">
                    </label>

                    <!-- Claude -->
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-colors">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-orange-400"></span>
                            <span class="text-xs font-medium text-slate-200">Claude 3.5 Sonnet</span>
                        </div>
                        <input type="checkbox" id="model-claude" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-pink-500 focus:ring-pink-500 accent-pink-500 cursor-pointer">
                    </label>

                    <!-- Gemini -->
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-colors">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                            <span class="text-xs font-medium text-slate-200">Gemini 1.5 Pro</span>
                        </div>
                        <input type="checkbox" id="model-gemini" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-pink-500 focus:ring-pink-500 accent-pink-500 cursor-pointer">
                    </label>
                </div>
            </div>

            <!-- Recent Chats -->
            <div>
                <p class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mb-3 px-1">Recent Chats</p>
                <div id="recent-chats" class="space-y-1">
                    <button class="w-full text-left p-2 rounded-lg text-xs text-slate-300 hover:bg-slate-900 flex items-center gap-2 truncate transition-colors">
                        <i data-lucide="message-square" class="w-3.5 h-3.5 text-slate-500 shrink-0"></i>
                        <span class="truncate">Code Refactoring & Optimiza...</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar Footer / User Profile -->
        <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-400 flex items-center justify-center font-bold text-xs">U</div>
                <span class="text-xs font-medium text-slate-300">User Session</span>
            </div>
            <a href="index.html" class="text-slate-500 hover:text-slate-300 transition-colors">
                <i data-lucide="home" class="w-4 h-4"></i>
            </a>
        </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col justify-between relative bg-[#0d1117] overflow-hidden">

        <!-- Background Pink Glow Aura -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-pink-600/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Chat Container / Empty State -->
        <div id="chat-feed" class="flex-1 overflow-y-auto p-6 max-w-4xl mx-auto w-full flex flex-col justify-center items-center relative z-10">

            <!-- Default Welcome Banner -->
            <div id="welcome-state" class="text-center my-auto space-y-4">
                <div class="w-20 h-20 mx-auto rounded-3xl bg-slate-900/90 border border-pink-500/30 flex items-center justify-center p-4 bine-logo-glow">
                    <svg class="w-full h-full text-pink-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30 80 C20 60, 40 40, 30 20" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
                        <path d="M50 85 C35 60, 65 35, 50 15" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
                        <path d="M70 80 C60 55, 80 40, 70 25" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
                    </svg>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Ready to synthesize outputs</h2>
                <p class="text-slate-400 text-xs sm:text-sm max-w-md mx-auto leading-relaxed">
                    Type a question below. Bine AI queries ChatGPT, Claude, and Gemini simultaneously.
                </p>
            </div>

            <!-- Dynamic Messages List -->
            <div id="message-list" class="w-full space-y-6 hidden"></div>
        </div>

        <!-- Prompt Input Bar -->
        <div class="p-6 relative z-10 max-w-4xl mx-auto w-full">
            <form id="chat-form" onsubmit="handleSend(event)" class="relative flex items-center">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask Bine AI to synthesize anything..."
                    class="w-full bg-[#161b26] text-slate-100 placeholder-slate-500 text-sm rounded-2xl pl-5 pr-14 py-4 border border-slate-800 focus:outline-none focus:border-pink-500/80 transition-all shadow-xl"
                    required
                >
                <button
                    type="submit"
                    class="absolute right-2.5 p-2.5 bg-pink-600 hover:bg-pink-500 text-white rounded-xl transition-all shadow-md shadow-pink-600/30 flex items-center justify-center"
                >
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const RENDER_BACKEND_URL = "https://bine-backend.onrender.com/synthesize";

        async function handleSend(e) {
            e.preventDefault();
            const inputEl = document.getElementById('user-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            // Hide welcome screen, show message list
            document.getElementById('welcome-state').classList.add('hidden');
            const messageList = document.getElementById('message-list');
            messageList.classList.remove('hidden');

            // Append User Message
            appendUserMessage(prompt);
            inputEl.value = '';

            // Append Loading Indicator
            const loadingId = appendLoadingMessage();

            try {
                const response = await fetch(RENDER_BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.synthesized) {
                    appendBotMessage(data.synthesized);
                } else {
                    appendBotMessage("An error occurred during synthesis. Please check your backend.");
                }
            } catch (err) {
                removeMessage(loadingId);
                appendBotMessage("Could not connect to Render backend server. It may be starting up (cold start).");
            }
        }

        function appendUserMessage(text) {
            const list = document.getElementById('message-list');
            const msg = document.createElement('div');
            msg.className = "flex justify-end";
            msg.innerHTML = `
                <div class="bg-pink-600/90 text-white text-xs sm:text-sm px-4 py-3 rounded-2xl max-w-lg shadow-lg">
                    ${text}
                </div>
            `;
            list.appendChild(msg);
            scrollToBottom();
        }

        function appendBotMessage(text) {
            const list = document.getElementById('message-list');
            const msg = document.createElement('div');
            msg.className = "flex items-start gap-3";
            msg.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-slate-900 border border-pink-500/40 text-pink-400 flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-pink-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30 80 C20 60, 40 40, 30 20" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
                        <path d="M50 85 C35 60, 65 35, 50 15" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
                        <path d="M70 80 C60 55, 80 40, 70 25" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
                    </svg>
                </div>
                <div class="bg-[#161b26] border border-slate-800 text-slate-200 text-xs sm:text-sm p-4 rounded-2xl max-w-xl shadow-xl leading-relaxed">
                    ${text}
                </div>
            `;
            list.appendChild(msg);
            scrollToBottom();
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const list = document.getElementById('message-list');
            const msg = document.createElement('div');
            msg.id = id;
            msg.className = "flex items-center gap-3 text-xs text-pink-400 font-medium animate-pulse";
            msg.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-slate-900 border border-pink-500/40 flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-4 h-4 text-pink-400"></i>
                </div>
                <span>Synthesizing ChatGPT, Claude, and Gemini outputs...</span>
            `;
            list.appendChild(msg);
            lucide.createIcons();
            scrollToBottom();
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const feed = document.getElementById('chat-feed');
            feed.scrollTop = feed.scrollHeight;
        }

        function resetChat() {
            document.getElementById('message-list').innerHTML = '';
            document.getElementById('message-list').classList.add('hidden');
            document.getElementById('welcome-state').classList.remove('hidden');
        }
    </script>
</body>
</html>
